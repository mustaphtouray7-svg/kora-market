<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#183a35">
    <title>{% block title %}Kora Market{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ url_for('index') }}" aria-label="Kora Market home">
        <span class="brand-mark" aria-hidden="true">K</span>
        <span>Kora Market</span>
      </a>
      <nav aria-label="Main navigation">
        <a href="{{ url_for('index') }}">Home</a>
        <a href="{{ url_for('catalog') }}">Shop</a>
        <a href="{{ url_for('cart') }}">Cart</a>
        <a href="{{ url_for('auth.login') }}">Admin</a>
      </nav>
    </header>
    <main class="page">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-list" aria-live="polite">
            {% for category, message in messages %}
              <p class="flash flash-{{ category }}">{{ message }}</p>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">A thoughtful way to shop local.</footer>
  </body>
</html>
