{% extends "base.html" %}
{% block title %}Payment method | Kora Market{% endblock %}
{% block content %}
  <section class="panel narrow">
    <div class="panel-header stack">
      <div>
        <p class="eyebrow">Order received</p>
        <h1>Thank you</h1>
        <p class="welcome-copy">Your order {{ order.order_number }} has been received. Choose a payment method to continue.</p>
      </div>
    </div>

    <div class="checkout-summary">
      <div class="checkout-total">
        <span>Total to pay</span>
        <strong>{{ "%.2f" | format(order.total) }} GMD</strong>
      </div>
    </div>

    <form method="post" action="{{ url_for('payment_method', order_id=order.id) }}" class="stack-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="field">
        <label for="provider">Payment method</label>
        <select id="provider" name="provider" required>
          <option value="">Select a payment method</option>
          <option value="wave">Wave</option>
          <option value="aps">APS</option>
          <option value="zona">Zona</option>
        </select>
      </div>

      <div class="field">
        <label for="payment_number">Payment number</label>
        <input id="payment_number" type="text" value="835889066" readonly>
      </div>

      <button class="button" type="submit">Continue to payment</button>
    </form>
  </section>
{% endblock %}
